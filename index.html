<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KSP風 ロケットシミュレーター 太陽系ミッション版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; pointer-events: none; display: none; font-size: 14px; line-height: 1.5; z-index: 10; text-shadow: 1px 1px 2px #000; }
        #rocketNameDisplay { font-size: 18px; color: #ffd700; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #777; padding-bottom: 5px; }
        #backToBuildBtn { pointer-events: auto; background: #ff4757; color: white; border: none; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        
        #controls { position: absolute; bottom: 15px; right: 10px; width: 60%; display: none; justify-content: flex-end; gap: 10px; padding: 0 10px; box-sizing: border-box; align-items: center; z-index: 10; }
        .btn { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; font-size: 11px; font-weight: bold; border: 2px solid #333; display: flex; justify-content: center; align-items: center; text-align: center; user-select: none; -webkit-user-select: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn:active { background: rgba(200, 200, 200, 0.9); transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        #thrustBtn { width: 80px; height: 80px; background: rgba(255, 100, 100, 0.8); color: white; font-size: 15px; text-shadow: 1px 1px 2px black; }
        
        #buildUI { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 8px; width: 220px; z-index: 10; max-height: 90vh; overflow-y: auto; display: none; }
        #buildUI h3 { margin: 0 0 5px 0; text-align: center; color: #333; }
        .build-input { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; text-align: center; margin-bottom: 5px; }
        .build-btn { padding: 8px; font-size: 14px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; background: #eee; border: 1px solid #ccc; transition: 0.2s; }
        .build-btn:hover { background: #ddd; }
        #launchBtn { background: #ff4757; color: white; border: none; padding: 15px; font-size: 16px; margin-top: 10px; box-shadow: 0 4px 0 #ff1e34; transition: 0.2s; }
        #launchBtn:active { transform: translateY(4px); box-shadow: none; }
        #launchBtn:disabled { background: #aaa; box-shadow: none; cursor: not-allowed; }
        
        #instruction { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-weight: bold; pointer-events: none; text-shadow: 1px 1px 2px black; line-height: 1.5; display: none; }
        #missionGuide { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #55ff55; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; display: none; z-index: 15; text-align: center; }

        #gameOverUI { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 30px; border-radius: 10px; text-align: center; display: none; z-index: 20; }
        #gameOverUI h2 { color: #ff4757; margin-top: 0; }
        #retryBtn { background: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold; }

        #navMap { position: absolute; top: 10px; right: 10px; background: rgba(0, 20, 40, 0.8); border: 2px solid #555; border-radius: 50%; display: none; z-index: 10; width: 150px; height: 150px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
        #attitudeIndicator { position: absolute; top: 170px; right: 35px; border-radius: 50%; border: 3px solid #333; display: none; z-index: 10; width: 100px; height: 100px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #joystickZone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid #aaa; display: none; z-index: 20; touch-action: none; }
        #joystickKnob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.9); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        #titleUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,20,0.85); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .title-btn { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; width: 300px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .title-btn:hover { background: #2980b9; transform: scale(1.05); }
        #notification { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(255, 215, 0, 0.95); color: #111; padding: 20px 40px; border-radius: 10px; font-weight: bold; font-size: 18px; display: none; z-index: 50; text-align: center; white-space: pre-wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 2px solid #fff; }

        .orbit-info { color: #aaffaa; font-weight: bold; }
        .throttle-bar { width: 100%; height: 10px; background: #333; margin-top: 5px; border-radius: 5px; overflow: hidden; }
        .throttle-fill { height: 100%; background: #ff4757; width: 0%; transition: width 0.1s; }

        #timeWarpUI { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: none; z-index: 20; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 8px; gap: 5px; }
        .tw-btn { background: #333; color: white; border: 1px solid #555; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tw-btn.active { background: #ff4757; border-color: #ff4757; box-shadow: 0 0 5px #ff4757; }
    </style>
</head>
<body>
    <div id="titleUI">
        <h1 style="font-size: 3em; color: #fff; margin-bottom: 50px; text-shadow: 0 0 15px #00aaff;">太陽系 ロケットシミュレーター</h1>
        <button id="btnSandbox" class="title-btn">サンドボックスモード</button>
        <button id="btnCareerNew" class="title-btn" style="background:#e67e22;">経営モード (初めから)</button>
        <button id="btnCareerLoad" class="title-btn" style="background:#27ae60; display:none;">経営モード (続きから)</button>
    </div>

    <div id="notification"></div>

    <div id="timeWarpUI">
        <button class="tw-btn active" data-warp="1">1x</button>
        <button class="tw-btn" data-warp="2">2x</button>
        <button class="tw-btn" data-warp="5">5x</button>
        <button class="tw-btn" data-warp="10">10x</button>
        <button class="tw-btn" data-warp="50">50x</button>
        <button class="tw-btn" data-warp="100">100x</button>
    </div>

    <div id="ui">
        <div id="rocketNameDisplay"></div>
        <div id="careerStatsFlight" style="color:#ffd700; font-weight:bold; display:none; margin-bottom: 5px; border-bottom: 1px solid #777; padding-bottom: 5px;"></div>
        <div>高度: <span id="alt">0</span> m</div>
        <div>速度: <span id="vel">0</span> m/s</div>
        <div>角度: <span id="angleUI">90.0</span>°</div>
        <div class="orbit-info">Ap: <span id="apUI">0</span> km</div>
        <div class="orbit-info">Pe: <span id="peUI">0</span> km</div>
        <div>推力: <span id="thrustUI">0</span> kN</div>
        <div class="throttle-bar"><div id="throttleFill" class="throttle-fill"></div></div>
        <div>燃料: <span id="fuel">0</span> L</div>
        <button id="backToBuildBtn">◀ 組立棟に戻る</button>
    </div>
    
    <div id="missionGuide"></div>

    <canvas id="navMap" width="200" height="200"></canvas>
    <canvas id="attitudeIndicator" width="200" height="200"></canvas>
    <div id="joystickZone"><div id="joystickKnob"></div></div>

    <div id="controls">
        <div id="autoBtn" class="btn">AUTO<br>OFF</div>
        <div id="sasBtn" class="btn">SAS<br>OFF</div>
        <div id="stageBtn" class="btn">✂️<br>分離</div>
        <div id="parachuteBtn" class="btn">🪂<br>開傘</div>
        <div id="thrustBtn" class="btn">🚀 推力</div>
    </div>

    <div id="buildUI">
        <h3>ロケット組立棟</h3>
        
        <div id="sponsorUI" style="display:none; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #ccc;">
            <div style="font-size:12px; font-weight:bold; color:#333; margin-bottom:3px;">スポンサー契約 (1回のみ)</div>
            <select id="sponsorSelect" class="build-input" style="width:100%; font-size:12px; font-weight:bold;">
                <option value="">-- スポンサーを選択 --</option>
                <option value="amazan">Amazan (資金+100万) : 月/高度1000km</option>
                <option value="mitsubishi">四菱重工業 (資金+30万) : 衛星低軌道</option>
                <option value="hih">HIH (資金+10万) : 高度100km</option>
            </select>
        </div>

        <div id="careerStatsBuild" style="font-weight:bold; color:#d35400; text-align:center; display:none; margin-bottom: 5px;"></div>
        <div id="vabCostDisplay" style="font-size:12px; font-weight:bold; text-align:center; margin-bottom: 10px; display:none; line-height:1.4;"></div>
        
        <input type="text" id="rocketNameInput" class="build-input" placeholder="機体名 (任意)" value="アポロ号">
        <button class="build-btn" id="addSatellite" style="background:#ffd700;">🛰 衛星</button>
        <button class="build-btn" id="addCapsule">△ カプセル</button>
        <button class="build-btn" id="addTank">🛢 タンク</button>
        <button class="build-btn" id="addEngine">🔥 エンジン</button>
        <button class="build-btn" id="addDecoupler" style="background:#ff7675; color:white;">⏸ 分離リング</button>
        <button class="build-btn" id="addRadialDecoupler" style="background:#e84393; color:white;">▶ 横 分離器</button>
        <button class="build-btn" id="addFin" style="background:#81ecec;">🪽 フィン</button>
        <div style="font-size: 11px; color: #666; text-align: center; margin-top:5px;">※ドラッグ中に [R][T][Y] キーで回転</div>
        <button class="build-btn" id="undoBuild">↩ 1つ戻る</button>
        <button class="build-btn" id="resetBuild" style="margin-top:10px;">🗑 リセット</button>
        <button class="build-btn" id="launchBtn">🚀 打ち上げ！</button>
    </div>
    <div id="instruction">パーツを追加し、ドラッグで組み立ててください。<br>緑の点が接続ノードです。<br><span style="color:#ffeb3b;">※画面の何もない部分をドラッグでカメラ回転、ホイールでズーム</span></div>

    <div id="gameOverUI">
        <h2>大破しました💥</h2>
        <button id="retryBtn">組立棟に戻る</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        const scaleFactor = 0.1;

        let gameMode = 'sandbox';
        let funds = 100000;
        let sciencePoints = 0;
        let missionLevel = 1; 
        let activeSponsor = null;
        let launchCost = 20000; 
        let timeWarp = 1; 

        // ADD: 万有引力定数
        const G = 6.67430e-11;
        // ADD: ③ 太陽系の惑星データ配列
        const planetData = [
            { name: "Sun", radius: 696340, orbitRadius: 0, orbitSpeed: 0, color: 0xffff00, mass: 1.989e30, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Mercury", radius: 2439, orbitRadius: 57900000, orbitSpeed: 0.0004, color: 0xaaaaaa, mass: 3.301e23, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Venus", radius: 6051, orbitRadius: 108200000, orbitSpeed: 0.0003, color: 0xeeddaa, mass: 4.867e24, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Earth", radius: 6371, orbitRadius: 149600000, orbitSpeed: 0.0002, color: 0x2233ff, mass: 5.972e24, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Moon", radius: 1737, orbitRadius: 149600000 + 384400, orbitSpeed: 0.0002, color: 0xcccccc, mass: 7.342e22, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Mars", radius: 3389, orbitRadius: 227900000, orbitSpeed: 0.0001, color: 0xff5533, mass: 6.417e23, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Jupiter", radius: 69911, orbitRadius: 778500000, orbitSpeed: 0.00005, color: 0xccaa88, mass: 1.898e27, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Saturn", radius: 58232, orbitRadius: 1432000000, orbitSpeed: 0.00003, color: 0xeeddcc, mass: 5.683e26, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Uranus", radius: 25362, orbitRadius: 2867000000, orbitSpeed: 0.00001, color: 0x88ddff, mass: 8.681e25, currentCANNONPos: new CANNON.Vec3(0, 0, 0) },
            { name: "Neptune", radius: 24622, orbitRadius: 4515000000, orbitSpeed: 0.000008, color: 0x3366ff, mass: 1.024e26, currentCANNONPos: new CANNON.Vec3(0, 0, 0) }
        ];

        const SPONSOR_DEFS = {
            amazan: { name: "Amazan", funding: 1000000, mission: "月周回または高度1000km以上", completed: false },
            mitsubishi: { name: "四菱重工業", funding: 300000, mission: "衛星を低軌道に投入", completed: false },
            hih: { name: "HIH", funding: 100000, mission: "高度100km到達", completed: false }
        };
        let sponsorsData = JSON.parse(JSON.stringify(SPONSOR_DEFS));

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.innerText = msg; notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 6000);
        }

        function saveGame() {
            if (gameMode !== 'career') return;
            const data = { funds: funds, science: sciencePoints, missionLevel: missionLevel, sponsors: sponsorsData, activeSponsor: activeSponsor, rocket: currentParts };
            localStorage.setItem("rocketGameSave", JSON.stringify(data));
        }

        function loadGame() {
            const data = localStorage.getItem("rocketGameSave");
            if (data) {
                const save = JSON.parse(data);
                funds = save.funds || 100000; sciencePoints = save.science || 0;
                missionLevel = save.missionLevel || 1;
                sponsorsData = save.sponsors || JSON.parse(JSON.stringify(SPONSOR_DEFS));
                activeSponsor = save.activeSponsor || null;
                currentParts = save.rocket || [];
            }
        }

        document.getElementById('sponsorSelect').addEventListener('change', (e) => {
            const key = e.target.value;
            if (key && sponsorsData[key] && !sponsorsData[key].completed && activeSponsor !== key) {
                activeSponsor = key; funds += sponsorsData[key].funding;
                showNotification(`${sponsorsData[key].name}と契約しました！\n資金 +¥${sponsorsData[key].funding.toLocaleString()}`);
                e.target.disabled = true; saveGame(); onVABChanged();
            }
        });

        document.querySelectorAll('.tw-btn').forEach(btn => {
            btn.onclick = () => {
                timeWarp = parseInt(btn.getAttribute('data-warp'));
                document.querySelectorAll('.tw-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
        });

        function createPlanetTexture(type) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 256; const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(512, 256); const data = imgData.data;
            for(let i = 0; i < data.length; i += 4) {
                let n = Math.random(); let r = 0, g = 0, b = 0;
                if (type === 'moon') { r = g = b = Math.floor(150 + n*50); } else if (type === 'mars') { r = Math.floor(180 + n*40); g = Math.floor(60 + n*30); b = Math.floor(20 + n*20); } else if (type === 'venus') { r = Math.floor(220 + n*30); g = Math.floor(180 + n*30); b = Math.floor(100 + n*20); }
                data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0); const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace; return tex;
        }

        // ADD: 重低音オーディオの初期化
        let audioCtx = null;
        let rocketAudio = null;
        function initRocketAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // 1. ノイズ生成（ゴオオオのベースとなる気流音）
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1; // ホワイトノイズ
            }
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            noiseSource.loop = true;

            // 高音をカットして轟音にするフィルター
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 150; 
            noiseFilter.Q.value = 1.0;

            // 2. 超低音のオシレーター（地響き・エンジンの振動）
            const bassOsc = audioCtx.createOscillator();
            bassOsc.type = 'sawtooth';
            bassOsc.frequency.value = 30; 

            const bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowpass';
            bassFilter.frequency.value = 100;

            // 3. サチュレーション（歪み効果で爆発的な迫力を出す）
            const waveShaper = audioCtx.createWaveShaper();
            function makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50;
                const n = 44100;
                const curve = new Float32Array(n);
                for (let i = 0; i < n; ++i) {
                    const x = (i * 2) / n - 1;
                    curve[i] = ((3 + k) * x * 20 * (Math.PI / 180)) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }
            waveShaper.curve = makeDistortionCurve(50);
            waveShaper.oversample = '4x';

            const masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.0;

            // オーディオノードの接続
            noiseSource.connect(noiseFilter);
            noiseFilter.connect(waveShaper);
            
            bassOsc.connect(bassFilter);
            bassFilter.connect(waveShaper);

            waveShaper.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            noiseSource.start();
            bassOsc.start();

            rocketAudio = { noiseSource, noiseFilter, bassOsc, masterGain };
        }

        // ADD: スロットルと連動したオーディオ更新
        function updateRocketAudio(throttle) {
            if (!rocketAudio || !audioCtx) return;
            // 音量 (throttleが上がると急激に音が大きくなる)
            const vol = Math.pow(Math.max(0, throttle), 0.5) * 1.5;
            rocketAudio.masterGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.1);
            
            // スロットルに応じてフィルターを開き、音を明るく(激しく)する
            rocketAudio.noiseFilter.frequency.setTargetAtTime(100 + throttle * 600, audioCtx.currentTime, 0.1);
            rocketAudio.bassOsc.frequency.setTargetAtTime(30 + throttle * 50, audioCtx.currentTime, 0.1);
        }


        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87CEEB); scene.fog = new THREE.FogExp2(0x87CEEB, 0.0000005);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000000); 
        camera.position.set(0, 10 * scaleFactor, 25 * scaleFactor);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(window.innerWidth, window.innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement); 
        controls.enableDamping = true; controls.target.set(0, 5 * scaleFactor, 0);

        const world = new CANNON.World(); world.gravity.set(0, 0, 0); 

        // 【スケール適用】惑星や軌道のサイズを 1/10 に
        const planetRadius = 600000 * scaleFactor; const atmosphereHeight = 70000 * scaleFactor;
        const planetCenter = new CANNON.Vec3(0, -planetRadius, 0); const planetCenterThree = new THREE.Vector3(0, -planetRadius, 0);

        const light = new THREE.DirectionalLight(0xffffff, 2.0); light.position.set(50, 100, 50); light.castShadow = true;
        light.shadow.camera.left = -100; light.shadow.camera.right = 100; light.shadow.camera.top = 100; light.shadow.camera.bottom = -100; light.shadow.camera.near = 0.5; light.shadow.camera.far = 1000; light.shadow.mapSize.width = 4096; light.shadow.mapSize.height = 4096;
        scene.add(light); scene.add(new THREE.AmbientLight(0x404040, 1.5));

        const starsGeo = new THREE.BufferGeometry(); const starsCount = 1200; const posArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 50000000 * scaleFactor; starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 4, color: 0xffffff, transparent: true, opacity: 0 }); scene.add(new THREE.Points(starsGeo, starsMat));

        // ADD: ③ 太陽系の惑星を描画するための配列
        const planetMeshes = [];
        planetData.forEach((p, index) => {
            const geo = new THREE.SphereGeometry(Math.max(p.radius * scaleFactor, 100 * scaleFactor), 32, 32); 
            const mat = p.name === "Sun" 
                ? new THREE.MeshBasicMaterial({ color: p.color })

                            targetDir = horiz.scale(Math.cos(pitchOffset)).vadd(gravityUp.scale(Math.sin(pitchOffset))); targetDir.normalize();
                        }
                    }

                    if(targetDir) {
                        const crossNode = worldUp.cross(targetDir); const dotProd = worldUp.dot(targetDir); const angleDiff = Math.acos(Math.max(-1, Math.min(1, dotProd)));
                        if(angleDiff > 0.001 && crossNode.lengthSquared() > 0.0001) { 
                            crossNode.normalize(); 
                            const pTerm = crossNode.scale(rocketBody.mass * 800 * angleDiff);
                            const dTerm = new CANNON.Vec3(rocketBody.angularVelocity.x, rocketBody.angularVelocity.y, rocketBody.angularVelocity.z).scale(rocketBody.mass * 300);
                            const finalTorque = new CANNON.Vec3(); pTerm.vsub(dTerm, finalTorque);
                            rocketBody.applyTorque(finalTorque); 
                        }
                    } else if (sasMode === 'HOLD') {
                        const dTerm = new CANNON.Vec3(rocketBody.angularVelocity.x, rocketBody.angularVelocity.y, rocketBody.angularVelocity.z).scale(rocketBody.mass * 200); rocketBody.applyTorque(new CANNON.Vec3(-dTerm.x, -dTerm.y, -dTerm.z));
                    } else if (speed > 5 && airDensity > 0.01 && sasMode === 'OFF' && !launchClamp) {
                        const vDir = speedVec.clone(); vDir.normalize(); const crossNode = worldUp.cross(vDir); const angleDiff = Math.acos(Math.max(-1, Math.min(1, worldUp.dot(vDir))));
                        if(crossNode.lengthSquared() > 0.0001) {
                            crossNode.normalize(); const maxAeroTorque = rocketBody.mass * 5; const aeroTorqueMag = Math.min(speed * speed * airDensity * rocketBody.mass * 0.005 * angleDiff, maxAeroTorque); rocketBody.applyTorque(crossNode.scale(aeroTorqueMag));
                            const aeroDamping = new CANNON.Vec3(-rocketBody.angularVelocity.x, -rocketBody.angularVelocity.y, -rocketBody.angularVelocity.z).scale(rocketBody.mass * speed * airDensity * 0.5); rocketBody.applyTorque(aeroDamping);
                        }
                    }
                } else {
                    const tAmt = rocketBody.mass * 100; const jx = state.joyX * Math.abs(state.joyX); const jy = state.joyY * Math.abs(state.joyY); const localT = new CANNON.Vec3(jy * tAmt, 0, -jx * tAmt); rocketBody.applyTorque(rocketBody.quaternion.vmult(localT));
                }

                let currentThrust = 0;
                if (throttle > 0 && rocketStats.fuel > 0) {
                    const fuelBurn = dt * rocketStats.maxThrust * 0.012 * throttle; 
                    rocketStats.fuel -= fuelBurn;
                    const minMass = rocketStats.totalMass * 0.2; 
                    if (rocketBody.mass > minMass) { 
                        rocketBody.mass -= fuelBurn * 0.02; 
                        if (rocketBody.mass < minMass) rocketBody.mass = minMass; 
                        // 重心ズレによる横転を防ぐため updateMassProperties() は使わず手動更新
                        rocketBody.invMass = 1 / rocketBody.mass;
                    }
                    currentThrust = rocketStats.maxThrust * throttle;
                    
                    let gimbalX = 0; let gimbalZ = 0;
                    if (hasManual) {
                        gimbalX = -state.joyX * 8;
                        gimbalZ = state.joyY * 8;
                    } else if (targetDir && sasMode !== 'OFF') {
                        const localTarget = rocketBody.quaternion.inverse().vmult(targetDir);
                        gimbalX = localTarget.x * 8;
                        gimbalZ = localTarget.z * 8;
                    }
                    gimbalX = Math.max(-20, Math.min(20, gimbalX));
                    gimbalZ = Math.max(-20, Math.min(20, gimbalZ));
                    
                    // FIX C: 姿勢を安定させるため、推力をロケットの重心 (0,0,0) から真っ直ぐかける
                    applyThrustToRocket(rocketBody, currentThrust, new CANNON.Vec3(0, 0, 0));
                    
                    // 姿勢制御（ジンバル）用の回転トルクを別でかける
                    const tAmt = currentThrust * 0.05; 
                    const localT = new CANNON.Vec3(gimbalZ * tAmt, 0, -gimbalX * tAmt);
                    rocketBody.applyTorque(rocketBody.quaternion.vmult(localT));



                    
                    flames.forEach(f => { f.visible = true; f.scale.setScalar(0.5 + throttle*0.5 + Math.random()*0.2); });
                    if (Math.random() < 0.6) { 
                        const smoke = new THREE.Mesh(sharedSmokeGeo, sharedSmokeMat); const emitPosLocal = new CANNON.Vec3(0, rocketStats.lowestY - 1.5 * scaleFactor, 0); const emitPosWorld = rocketBody.quaternion.vmult(emitPosLocal).vadd(rocketBody.position); smoke.position.copy(emitPosWorld);
                        const exhaustVelLocal = new CANNON.Vec3((Math.random()-0.5)*5*scaleFactor, -15*scaleFactor, (Math.random()-0.5)*5*scaleFactor); const exhaustVelWorld = rocketBody.quaternion.vmult(exhaustVelLocal).vadd(rocketBody.velocity); scene.add(smoke); smokeParticles.push({ mesh: smoke, velocity: new THREE.Vector3(exhaustVelWorld.x, exhaustVelWorld.y, exhaustVelWorld.z), life: 2.0 });
                    }
                } else { flames.forEach(f => f.visible = false); }

                // FIX B: 物理ステップの安定化ループ
                if(!rocketMesh.velocity) rocketMesh.velocity = new THREE.Vector3();
                const rocketForce = new THREE.Vector3(rocketBody.force.x, rocketBody.force.y, rocketBody.force.z); const acceleration = rocketForce.clone().divideScalar(rocketBody.mass);
                rocketMesh.velocity.add(acceleration.multiplyScalar(dt)); rocketMesh.position.add(rocketMesh.velocity.clone().multiplyScalar(dt));
                
                // 固定ステップの更新
                physicsAccumulator += Math.min(dt, 0.25);
                while (physicsAccumulator >= FIXED_STEP) {
                    world.step(FIXED_STEP);
                    physicsAccumulator -= FIXED_STEP;
                }
                
                // FIX B: メッシュへの同期
                rocketMesh.position.copy(new THREE.Vector3(rocketBody.position.x, rocketBody.position.y, rocketBody.position.z));
                rocketMesh.quaternion.copy(new THREE.Quaternion(rocketBody.quaternion.x, rocketBody.quaternion.y, rocketBody.quaternion.z, rocketBody.quaternion.w));

                const deltaPos = rocketMesh.position.clone().sub(controls.target); controls.target.copy(rocketMesh.position); camera.position.add(deltaPos); camera.up.copy(new THREE.Vector3(gravityUp.x, gravityUp.y, gravityUp.z));

                const pitchAngle = Math.asin(Math.max(-1, Math.min(1, worldUp.dot(gravityUp)))) * (180 / Math.PI); uiAngle.innerText = pitchAngle.toFixed(1);
                const rightVec = rocketBody.quaternion.vmult(new CANNON.Vec3(1,0,0)); const rollAngle = Math.atan2(rightVec.y, rightVec.x); updateAttitudeIndicator(pitchAngle, rollAngle);

                const orbit = calculateOrbit(rocketMesh.position, rocketBody.velocity); uiAp.innerText = isNaN(orbit.ap) || orbit.ap < 0 ? "---" : (orbit.ap / scaleFactor / 1000).toFixed(1); uiPe.innerText = isNaN(orbit.pe) ? "---" : (orbit.pe / scaleFactor / 1000).toFixed(1);

                scene.background.setHSL(0.55, 0.8, 0.5 * Math.max(0, 1 - (altitude / 50000))); starsMat.opacity = Math.max(0, Math.min(1, (altitude - 10000) / 40000)); scene.fog.density = 0.0000005 * Math.max(0, 1 - (altitude / 30000));
                uiAlt.innerText = Math.max(0, altitude).toFixed(0); uiVel.innerText = speed.toFixed(1); uiFuel.innerText = Math.max(0, rocketStats.fuel).toFixed(0); uiThrust.innerText = (currentThrust / 10).toFixed(0);

                if(altitude < 100) missionGuide.innerText = "垂直に上昇せよ"; else if(altitude < 40000) missionGuide.innerText = "重力ターン：右へ少し傾けろ"; else if(orbit.pe < 0) missionGuide.innerText = "水平に加速し軌道に乗れ"; else missionGuide.innerText = "軌道周回中！目的地へ向かえ";
                updateNavMap(); orbitLine.visible = true;
                let simPos = rocketBody.position.clone(); let simVel = rocketBody.velocity.clone(); const dtSim = 15.0; let simCount = 0;
                for(let i=0; i<300; i++) {
                    orbitPoints[i*3] = simPos.x; orbitPoints[i*3+1] = simPos.y; orbitPoints[i*3+2] = simPos.z; simCount++;
                    const rVec = new CANNON.Vec3(); planetCenter.vsub(simPos, rVec); const rSq = rVec.lengthSquared(); rVec.normalize(); const gAccel = (9.81 * Math.pow(planetRadius, 2)) / rSq;
                    simVel.x += rVec.x * gAccel * dtSim; simVel.y += rVec.y * gAccel * dtSim; simVel.z += rVec.z * gAccel * dtSim; simPos.x += simVel.x * dtSim; simPos.y += simVel.y * dtSim; simPos.z += simVel.z * dtSim;
                    if (simPos.distanceTo(planetCenter) < planetRadius) break; 
                }
                orbitGeo.setDrawRange(0, simCount); orbitGeo.attributes.position.needsUpdate = true;

                const distISS = rocketBody.position.distanceTo(issBody.position); const distMars = rocketBody.position.distanceTo(marsBody.position); const distVenus = rocketBody.position.distanceTo(venusBody.position);
                const hitGround = altitude < Math.abs(rocketStats.lowestY) / scaleFactor + 0.6; const isHard = speed > (parachuteDeployed ? 15 : 8);
                if ((hitGround || distMoon < moonRadius+0.5*scaleFactor || distISS < 20*scaleFactor || distMars < marsRadius+0.5*scaleFactor || distVenus < venusRadius+0.5*scaleFactor) && isHard && !launchClamp) {
                    isExploded = true; createExplosion(rocketMesh.position); scene.remove(rocketMesh);
                    document.getElementById('gameOverUI').style.display = 'block'; document.getElementById('controls').style.display = 'none'; document.getElementById('missionGuide').style.display = 'none'; document.getElementById('joystickZone').style.display = 'none'; document.getElementById('timeWarpUI').style.display = 'none'; orbitLine.visible = false;
                    // ADD: 爆発時に音を消す
                    if (audioCtx) updateRocketAudio(0);
                }
            }
            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); if(mapFullscreen) { navMap.width = window.innerWidth; navMap.height = window.innerHeight; }});
    </script>
</body>
